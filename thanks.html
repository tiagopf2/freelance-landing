<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thanks | Tiago Perez</title>
<style>
:root{
  --ink:#101828; --ink-2:#344054; --ink-3:#667085;
  --line:#e4e7ec; --bg:#ffffff; --bg-soft:#f7f8fa;
  --accent:#1d4ed8; --accent-dark:#1a3fb0; --accent-soft:#eef2ff;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink-2);background:var(--bg-soft);
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:grid;place-items:center;padding:24px}
h1,p{margin:0}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

.panel{width:100%;max-width:520px;background:var(--bg);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 4px 16px rgba(16,24,40,.08);padding:34px 26px 30px;
  text-align:center}
@media (min-width:560px){.panel{padding:40px 40px 34px}}
.mark{width:54px;height:54px;margin:0 auto 20px;border-radius:50%;
  background:var(--accent-soft);display:grid;place-items:center}
.mark svg{width:27px;height:27px;stroke:var(--accent);stroke-width:2.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
h1{font-size:27px;line-height:1.2;letter-spacing:-.025em;color:var(--ink);font-weight:700}
.lede{margin-top:12px;font-size:16.5px;color:var(--ink-3)}
.next{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);
  font-size:15.5px;color:var(--ink-2)}
.next b{color:var(--ink);font-weight:650}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:24px;
  font-size:15.5px;font-weight:620;color:var(--accent)}
.back:hover{color:var(--accent-dark);text-decoration:underline;text-underline-offset:3px}
.back svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<div class="panel">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M4 12.5l5.2 5L20 6.5"/></svg>
  </div>

  <h1>Got it, thanks.</h1>
  <p class="lede">Your message is with me and I read everything that comes in.</p>

  <p class="next"><b>What happens now.</b> I will come back to you within a day,
    usually sooner. If it looks like a good fit I will suggest a time for a
    fifteen minute call, and there is nothing to prepare for it.</p>

  <a class="back" href="/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M12 5l-7 7 7 7"/></svg>
    Back to the site
  </a>
</div>

</body>
</html>
