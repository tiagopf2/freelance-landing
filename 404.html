<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Tiago Perez</title>
<style>
:root{
  --ink:#101828; --ink-2:#344054; --ink-3:#667085;
  --line:#e4e7ec; --bg:#ffffff; --bg-soft:#f7f8fa;
  --accent:#1d4ed8; --accent-dark:#1a3fb0; --accent-soft:#eef2ff;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink-2);background:var(--bg-soft);
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:grid;place-items:center;padding:24px}
h1,p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

.panel{width:100%;max-width:520px;background:var(--bg);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 4px 16px rgba(16,24,40,.08);padding:34px 26px 30px}
@media (min-width:560px){.panel{padding:40px 40px 34px}}
.code{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--accent);margin-bottom:12px}
h1{font-size:27px;line-height:1.2;letter-spacing:-.025em;color:var(--ink);font-weight:700}
.lede{margin-top:12px;font-size:16.5px;color:var(--ink-3)}

.links{margin-top:24px;padding-top:22px;border-top:1px solid var(--line);display:grid;gap:11px}
.links a{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--accent)}
.links a:hover{color:var(--accent-dark);text-decoration:underline;text-underline-offset:3px}
.links svg{width:17px;height:17px;flex:none;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<div class="panel">
  <p class="code">Page not found</p>
  <h1>That link went nowhere.</h1>
  <p class="lede">The page you were after has moved or never existed. Nothing you did wrong.</p>

  <ul class="links">
    <li>
      <a href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M12 5l-7 7 7 7"/></svg>
        Back to the start
      </a>
    </li>
    <li>
      <a href="/#start">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        See what I can fix for you
      </a>
    </li>
    <li>
      <a href="/#contact">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 7l9 6 9-6"/></svg>
        Get in touch
      </a>
    </li>
  </ul>
</div>

</body>
</html>
